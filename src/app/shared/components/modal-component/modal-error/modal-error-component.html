<dialog #modalError class="modal">
  <div class="modal-box bg-base-100 border border-error/30">
    <form method="dialog">
      <button
        type="submit"
        class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      >
        ✕
      </button>
    </form>

    <h3 class="text-lg font-bold text-error">
      {{ title() }}
    </h3>

    <p class="py-4 text-base-content/70">
      @if (status() > 0) {
        <span>{{ status() }} - </span>
      }

      {{ message() }}
    </p>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-error" type="submit">
          Cerrar
        </button>
      </form>
    </div>
  </div>
</dialog>
