<dialog #modalSuccess class="modal">
  <div class="modal-box bg-base-100 border border-success/30">
    <button
      type="button"
      class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      (click)="close()"
    >
      ✕
    </button>

    <h3 class="text-lg font-bold text-success">
      {{ title() }}
    </h3>

    <p class="py-4 text-base-content/70">
      {{ message() }}
    </p>

    <div class="modal-action">
      <button
        type="button"
        class="btn btn-success"
        (click)="close()"
      >
        Cerrar
      </button>
    </div>
  </div>
</dialog>
