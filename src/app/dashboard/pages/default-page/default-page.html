@if (loading()) {
  <div class="flex justify-center items-center min-h-screen">
    <span class="loading loading-spinner loading-lg"></span>
    <span class="ml-3">Cargando información...</span>
  </div>
} @else if (errorMessage()) {
  <div class="alert alert-error my-4">
    {{ errorMessage() }}
  </div>
} @else {
  <div class="hero bg-base-200 min-h-screen my-4">
    <div class="hero-content flex-col lg:flex-row-reverse w-full">
      <img
        alt="Autobús"
        src="assets/imgs/bus.jpg"
        class="w-full lg:w-5/12 max-w-none rounded-lg shadow-2xl"
      />

      <div class="w-full lg:w-7/12">
        <h1 class="text-5xl font-bold">Nuevas Noticias!</h1>

        <p class="py-6">
          {{ message() }}
        </p>

        <button class="btn btn-primary">
          Saber más
        </button>
      </div>
    </div>
  </div>
}
